<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rayon — ma collection de manga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ══ Écran de connexion ══ -->
  <div id="auth-screen" class="auth-screen" hidden>
    <div class="auth-box">
      <h1 class="wordmark">Rayon</h1>
      <p class="auth-intro">Coche les tomes que tu possèdes. Les cases vides sont ceux qu'il te reste à trouver.</p>

      <form id="auth-form" class="auth-form" novalidate>
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" minlength="6" required>

        <p id="auth-error" class="form-error" role="alert" hidden></p>

        <button type="submit" id="auth-submit" class="btn-primary">Se connecter</button>
      </form>

      <p class="auth-switch">
        <span id="auth-switch-text">Pas encore de compte ?</span>
        <button type="button" id="auth-toggle" class="btn-link">Créer un compte</button>
      </p>
    </div>
  </div>

  <!-- ══ Application ══ -->
  <div id="app-screen" hidden>
    <header class="topbar">
      <h1 class="wordmark wordmark-sm">Rayon</h1>
      <div class="topbar-right">
        <span id="user-email" class="user-email"></span>
        <button type="button" id="logout" class="btn-link">Se déconnecter</button>
      </div>
    </header>

    <main class="wrap">

      <section class="search">
        <form id="search-form" class="search-form" role="search">
          <label for="search-input" class="visually-hidden">Chercher une série</label>
          <input type="search" id="search-input" placeholder="Chercher une série à ajouter…" autocomplete="off">
          <button type="submit" class="btn-primary">Chercher</button>
        </form>
        <div id="search-results" class="search-results" hidden></div>
      </section>

      <section id="stats" class="stats" hidden>
        <p><strong id="stat-owned">0</strong> tomes en rayon</p>
        <p><strong id="stat-missing">0</strong> tomes manquants</p>
        <p><strong id="stat-series">0</strong> séries suivies</p>
      </section>

      <div id="collection" class="collection"></div>

      <p id="empty-state" class="empty-state" hidden>
        Ton rayon est vide. Cherche une série ci-dessus pour commencer.
      </p>

      <p id="loading" class="loading" hidden>Chargement…</p>

    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
